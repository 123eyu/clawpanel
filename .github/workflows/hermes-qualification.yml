name: Manual Hermes Qualification

# 先由维护者审查并注册到 main，再在 main 手工选择不可变导出 SHA。
# 不复用/改写 Daily Maintenance，不自动 AI、PR、升级用户机器或发版。
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'baseline=0.21.5；candidate=0.22.2；两者必须各有精确导出 SHA'
        type: choice
        options: [baseline, candidate, both]
        default: baseline
      platform:
        description: 'Windows Web 后真实 native Tauri；Linux fresh11 后两轮长 UI'
        type: choice
        options: [windows, linux, both]
        default: both
      baseline_sha:
        description: '旧版0.21.5导出的完整40位SHA；不改安装pin'
        type: string
        required: false
      candidate_sha:
        description: '新版0.22.2导出的完整40位SHA；不执行候选自己的验收器'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: hermes-qualification-manual
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'qingchencloud/clawpanel'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - id: matrix
        name: 在 checkout 候选之前验证完整 SHA（无 shell 输入插值）
        env:
          TARGET: ${{ inputs.target }}
          BASELINE_SHA: ${{ inputs.baseline_sha }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          node tooling/scripts/test-hermes-windows-qualification.mjs --matrix > matrix.json
          node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("matrix.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"matrix="+JSON.stringify(m)+"\n")'

  qualify:
    name: Windows ${{ matrix.variant }} — production Web + actual native Tauri
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'qingchencloud/clawpanel' && inputs.platform != 'linux'
    runs-on: windows-2025
    # 3 次 Web + 2 次 Rust 安装各仍900秒，另含冷 Rust 构建与14分钟 UI预算；不重试失败。
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: tooling
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: candidate
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.16.0
      - name: 真实 VM/SID 资格后才建立短 HOME 并执行候选（无本机回退）
        id: web
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          EXPECTED_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          node tooling/scripts/test-hermes-windows-qualification.mjs --execute --root candidate --sha "$env:CANDIDATE_SHA" --version "$env:EXPECTED_VERSION" --variant "$env:VARIANT" --output "$env:RUNNER_TEMP/hermes-qualification-$env:VARIANT"
          exit $LASTEXITCODE
      - name: 原资格先验、同 Web HOME 的私有 Rust 工具链（不写宿主 PATH）
        id: native_environment
        shell: pwsh
        env:
          CANDIDATE_SHA: ${{ matrix.sha }}
          EXPECTED_VERSION: ${{ matrix.version }}
          VARIANT: ${{ matrix.variant }}
        run: |
          @'
          import fs from 'node:fs'; import path from 'node:path'; import assert from 'node:assert/strict'; import crypto from 'node:crypto'; import {spawn,spawnSync} from 'node:child_process';
          import {actualRunnerProof,validateRunnerProof,runnerProofFailures,hostSnapshot,assertHostUnchanged,isolationEnv,assertSameSource} from './tooling/scripts/test-hermes-windows-qualification.mjs';
          const output=path.join(process.env.RUNNER_TEMP,'hermes-native-build-'+process.env.VARIANT),webOutput=path.join(process.env.RUNNER_TEMP,'hermes-qualification-'+process.env.VARIANT),home=path.join(webOutput,'h');
          assert.ok(!fs.existsSync(output),'native build 输出必须全新'); fs.mkdirSync(output);
          const report={status:'failed',candidateSha:process.env.CANDIDATE_SHA,commands:[]},write=(name,value)=>fs.writeFileSync(path.join(output,name),JSON.stringify(value,null,2)),save=()=>write('environment-receipt.json',report),pending=new Set();
          const alive=pid=>{try{process.kill(pid,0);return true}catch{return false}};
          let proof,before,env; save();
          async function run(program,args,timeout=120000){
            const n=report.commands.length,item={program,args,startedAt:new Date().toISOString()};report.commands.push(item);save();
            const result=await new Promise((resolve,reject)=>{const child=spawn(program,args,{env,windowsHide:true,stdio:['ignore','pipe','pipe']});item.pid=child.pid;if(child.pid)pending.add(child.pid);let stdout='',stderr='';
              child.stdout.on('data',d=>{fs.appendFileSync(path.join(output,'setup-'+n+'.stdout.log'),d);stdout+=d});child.stderr.on('data',d=>{fs.appendFileSync(path.join(output,'setup-'+n+'.stderr.log'),d);stderr+=d});
              const timer=setTimeout(()=>{item.timedOut=true;if(child.pid)spawnSync('taskkill.exe',['/PID',String(child.pid),'/T','/F'],{env,windowsHide:true});reject(Error('native toolchain command timeout'))},timeout);
              child.once('error',e=>{clearTimeout(timer);reject(e)});child.once('close',(code,signal)=>{clearTimeout(timer);pending.delete(child.pid);Object.assign(item,{code,signal,finishedAt:new Date().toISOString()});save();resolve({code,stdout,stderr})});});
            assert.equal(result.code,0,result.stderr.slice(-4000));return result.stdout.trim();
          }
          try{
            proof=actualRunnerProof();write('runner-proof.json',proof);write('runner-admission.json',{failedConditions:runnerProofFailures(proof)});validateRunnerProof(proof);
            before=hostSnapshot(proof);write('host-before.json',before);
            const web=JSON.parse(fs.readFileSync(path.join(webOutput,'report.json'),'utf8'));
            assert.equal(web.status,'passed-web-native-missing');assert.equal(web.candidateSha,process.env.CANDIDATE_SHA);assert.equal(web.expectedVersion,process.env.EXPECTED_VERSION);
            assertSameSource(path.resolve('candidate'),web.sourceHashes);
            env=isolationEnv({home,temp:path.join(output,'tmp'),realProfile:proof.actualProfile});fs.mkdirSync(env.TEMP,{recursive:true});
            const tools=path.join(home,'.native-tools');env.CARGO_HOME=path.join(tools,'cargo');env.RUSTUP_HOME=path.join(tools,'rustup');env.RUSTUP_TOOLCHAIN='stable-x86_64-pc-windows-msvc';
            const rustup=path.join(proof.actualProfile,'.cargo/bin/rustup.exe');assert.ok(fs.statSync(rustup).isFile());
            await run(rustup,['toolchain','install',env.RUSTUP_TOOLCHAIN,'--profile','minimal','--no-self-update'],900000);
            const cargo=await run(rustup,['which','cargo','--toolchain',env.RUSTUP_TOOLCHAIN]),rustc=await run(rustup,['which','rustc','--toolchain',env.RUSTUP_TOOLCHAIN]);
            for(const file of [cargo,rustc])assert.ok(fs.realpathSync(file).toLowerCase().startsWith(fs.realpathSync(home).toLowerCase()+path.sep),'Rust 工具链越出私有 HOME');
            report.rustVersion=await run(rustc,['--version']);report.rustupSha256=crypto.createHash('sha256').update(fs.readFileSync(rustup)).digest('hex');
            const values={CARGO_HOME:env.CARGO_HOME,RUSTUP_HOME:env.RUSTUP_HOME,RUSTUP_TOOLCHAIN:env.RUSTUP_TOOLCHAIN,NATIVE_CARGO:cargo,NATIVE_TOOL_BIN:path.dirname(cargo),NATIVE_DRIVER_TARGET:path.join(tools,'driver-target'),NATIVE_TAURI_ROOT:path.join(tools,'tauri-driver'),NATIVE_EDGE_DRIVER:path.join(tools,'edge/msedgedriver.exe')};
            for(const [key,value]of Object.entries(values)){assert.ok(!/[\r\n]/.test(value));fs.appendFileSync(process.env.GITHUB_ENV,key+'='+value+'\n')}
            report.privatePaths=values;report.status='passed';
          }catch(e){report.error=e.stack;process.exitCode=1}
          finally{
            for(const pid of pending)if(alive(pid))spawnSync('taskkill.exe',['/PID',String(pid),'/T','/F'],{env,windowsHide:true});
            for(let n=0;n<30&&[...pending].some(alive);n++)await new Promise(r=>setTimeout(r,500));
            try{assert.ok([...pending].every(pid=>!alive(pid)),'工具链子进程未退出');if(before){const after=hostSnapshot(proof);write('host-after.json',after);assertHostUnchanged(before,after);report.hostUnchanged=true}}catch(e){report.error=String(e);report.status='failed';process.exitCode=1}save();
          }
          '@ | node --input-type=module
          exit $LASTEXITCODE
      - name: 固定既有 v2 Rust cache 的不可变 commit（仅私有 Cargo/构建缓存）
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2，官方 annotated tag 已解引用
        with:
          prefix-key: hermes-qualification-native-v1
          key: ${{ matrix.variant }}-${{ matrix.sha }}-tauri-driver-2.1.0
          workspaces: candidate/src-tauri -> target
