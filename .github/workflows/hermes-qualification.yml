              child.stdout.on('data',d=>{fs.appendFileSync(path.join(output,'build-'+n+'.stdout.log'),d);stdout+=d});child.stderr.on('data',d=>{fs.appendFileSync(path.join(output,'build-'+n+'.stderr.log'),d);stderr+=d});
              const timer=setTimeout(()=>{item.timedOut=true;if(child.pid)spawnSync('taskkill.exe',['/PID',String(child.pid),'/T','/F'],{env,windowsHide:true});reject(Error('native build command timeout'))},timeout);
